<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>ponte de criativos</title>
<body style="font:14px/1.6 system-ui,sans-serif;padding:24px;background:#0d1b1e;color:#e8f1f2">
<h1 style="font-size:16px">ponte de criativos</h1>
<div id="log"></div>
<script>
(function(){
  var ALVO = 'https://adsmanager.facebook.com';
  var LISTA = [
    { nome: 'OSC_AD2_quando_voce_nao_define.jpg', url: '/criativos/ad2.jpg', tipo: 'image/jpeg' },
    { nome: 'OSC_AD3_o_problema_nao_e_a_ia.jpg',  url: '/criativos/ad3.jpg', tipo: 'image/jpeg' }
  ];
  var log = document.getElementById('log');
  function diz(t){ log.insertAdjacentHTML('beforeend', '<p>' + t + '</p>'); }

  Promise.all(LISTA.map(function(it){
    return fetch(it.url).then(function(r){ return r.blob(); }).then(function(b){
      diz(it.nome + ' — ' + b.size + ' bytes');
      return { nome: it.nome, tipo: it.tipo, blob: b };
    });
  })).then(function(itens){
    if (window.opener) {
      window.opener.postMessage({ __osc: 'criativos', itens: itens }, ALVO);
      diz('enviado para o opener');
    } else {
      diz('sem opener — nada enviado');
    }
  }).catch(function(e){ diz('erro: ' + e.message); });
})();
</script>
</body>
</html>
